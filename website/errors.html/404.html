<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Sayfa Bulunamadı</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111827;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
    padding: 40px 25px;
    max-width: 550px;
}

.code {
    font-size: 120px;
    font-weight: bold;
    color: #818cf8;
    letter-spacing: 5px;
    text-shadow: 0 0 35px rgba(129, 140, 248, 0.25);
}

h1 {
    font-size: 28px;
    margin-bottom: 15px;
}

p {
    color: #9ca3af;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 30px;
}

a {
    display: inline-block;
    padding: 13px 28px;
    background: #6366f1;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    transition: 0.3s;
}

a:hover {
    background: #4f46e5;
    transform: translateY(-3px);
}

.icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.footer {
    margin-top: 45px;
    color: #4b5563;
    font-size: 12px;
}

@media(max-width: 500px) {
    .code { font-size: 85px; }
    h1 { font-size: 23px; }
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">🔍</div>

    <div class="code">404</div>

    <h1>Sayfa Bulunamadı</h1>

    <p>
        Aradığınız sayfa mevcut değil, taşınmış
        veya kaldırılmış olabilir.
        Lütfen adresi kontrol edin.
    </p>

    <a href="/">Ana Sayfaya Dön</a>

    <div class="footer">
        ERROR 404 · PAGE NOT FOUND
    </div>

</div>

</body>
</html>
