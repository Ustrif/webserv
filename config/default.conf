# Varsayılan virtual host
server {
    listen 127.0.0.1:8080;
    server_name webserv.local www.webserv.local;

    client_max_body_size 10M;

    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location / {
        allow_methods GET POST;
        root ./website;
        index index.html default.html;
        autoindex off;
    }

    location /autoindex {
        allow_methods GET;
        root ./website/autoindex;
        autoindex on;
    }

    location /deeper {
        allow_methods DELETE;
        root ./website/deeper;
    }

    location /upload {
        allow_methods GET POST;
		root ./post_body;
        upload_enable on;
        upload_store ./post_body;
        autoindex on;
        client_max_body_size 1M;
    }

    location /cgi-py {
        allow_methods GET POST;
        root ./website/cgi-py;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }

    location /cgi-pl {
        allow_methods GET POST;
        root ./website/cgi-pl;
        cgi_ext .pl;
        cgi_path /usr/bin/perl;
    }

    location /redirect-301 {
        return 301 /;
    }
}

# Name-based virtual host.
server {
    listen 127.0.0.1:8080;
    server_name api.webserv.local api.local;

    client_max_body_size 4M;

    error_page 404 /errors/api-404.html;
    error_page 500 502 503 504 /errors/api-50x.html;

    location / {
        allow_methods GET;
        root ./website/other;
        index index.html;
        autoindex off;
    }
}

# Ayrı listener / ikinci server
server {
    listen 127.0.0.1:9090;
    server_name secondary.webserv.local;

    client_max_body_size 1M;

    error_page 404 /errors/404.html;

    location / {
        allow_methods GET;
        root ./website/secondary;
        index index.html;
        autoindex off;
    }
}
